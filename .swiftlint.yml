strict: true
included:
  - Packages
  - App
  - ManualTestApp
excluded:
  - .build
  - "**/.build"
  - App/WindowCleaner.xcodeproj
  - ManualTestApp/ManualTestApp.xcodeproj
  - "**/DerivedData"

# SwiftFormat owns formatting — disable SwiftLint's overlapping formatting rules
# so the two tools never disagree.
disabled_rules:
  # No file-length limit — splitting a file just to satisfy a line count is noise.
  - file_length
  # No line-length limit — SwiftFormat doesn't wrap (no --maxwidth), so this rule
  # just forces tedious manual wrapping of long log/diagnostic lines. Not worth it.
  - line_length
  - trailing_comma
  - opening_brace
  - colon
  - comma
  - vertical_whitespace
  - trailing_whitespace
  # sorted_imports conflicts with SwiftFormat's --importgrouping testable-bottom
  # (SwiftLint alphabetizes; SwiftFormat groups @testable at bottom). SwiftFormat
  # is the authoritative formatter, so this rule is disabled here.
  - sorted_imports
  # `todo` is disabled so `// TODO:` / `// FIXME:` markers can be used to track
  # deferred pre-ship work. (With `strict: true`, an enabled `todo` rule would
  # fail the lint gate on every such marker.)
  - todo

# Opt into a stricter set.
opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - contains_over_filter_count
  - closure_spacing
  - redundant_type_annotation
  - explicit_init
  - fatal_error_message
  - prefer_self_type_over_type_of_self

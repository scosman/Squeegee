name: Squeegee
options:
  bundleIdPrefix: net.scosman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -warnings-as-errors"
    CODE_SIGN_STYLE: Manual
    INFOPLIST_KEY_CFBundleDisplayName: "Squeegee"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: B5L5M4B62J
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: B5L5M4B62J

packages:
  SqueegeeKit:
    path: ../Packages/SqueegeeKit

targets:
  Squeegee:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.scosman.squeegee
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Squeegee.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: icon
    dependencies:
      - package: SqueegeeKit
        product: AppShellUI
      - package: SqueegeeKit
        product: AppCore
      - package: SqueegeeKit
        product: MenuBarUI
      - package: SqueegeeKit
        product: SharedUI
      - package: SqueegeeKit
        product: SystemBridge
      - package: SqueegeeKit
        product: Persistence

schemes:
  Squeegee:
    build:
      targets:
        Squeegee: all
    run:
      config: Debug
    test:
      config: Debug
